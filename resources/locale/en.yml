    catch_modal_text: If you enable this feature, Mail Catcher will intercept all email sent by the system and log it here.
    catch_modal_settings: Your mail driver and SMTP settings are not changed. You can switch this off at any time to allow email to flow again.
    catch_modal_warning: PLEASE NOTE THIS STOPS ALL EMAIL FROM BEING SENT FROM THIS FORUM.
